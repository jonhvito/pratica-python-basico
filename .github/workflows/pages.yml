name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          for file in *.js; do node --check "$file"; done
          node verificacao/conteudo.cjs
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html styles.css exercicios.js curriculo.js professor.js python.js aprendizagem.js treinador.js manifest.webmanifest icone.svg service-worker.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
